<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css selectors</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            color: yellowgreen;
            font-size: 45px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        p{
            color: rgb(187, 255, 71);
            text-align: center;
            font-size: 20px;
        }
        .p2 {
            color: cadetblue;
        }
    </style>
</head>
<body>
    <h1>Hello World</h1>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Perferendis, facere! Omnis aut quo suscipit illum itaque totam voluptate obcaecati molestiae!</p>
    <p class="p2">Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptates sit reprehenderit obcaecati, illo unde fuga!</p>
</body>
</html>
