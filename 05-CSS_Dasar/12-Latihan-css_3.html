<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihat 3</title>
    <style>
      @font-face {
        font-family: "Playfair";
        src: url(font/PLAYFAIRDISPLAY-EXTRABOLD.TTF) format("truetype");
        font-display: swap;
        font-style: normal;
        font-weight: normal;
      }
      @font-face {
        font-family: "poppins";
        src: url(font/POPPINS-REGULAR.TTF) format("truetype");
        font-style: normal;
        font-weight: normal;
        font-display: swap;
      }
      body {
        background-image:
          linear-gradient(to bottom, rgb(0 0 0 / 80%), rgb(0 0 0 / 30%)),
          url(svg/e48e63fd5f4fc1b4ae72ca401d6eab1e.svg);
        background-size: cover;
        min-height: 100vh;
        background-attachment: fixed;
        background-repeat: no-repeat;
      }
      h1 {
        font-size: 50px;
        text-align: center;
        color: #cac8c8;
        font-style: italic;
        font-family: "Playfair";
        letter-spacing: 10px;
        text-shadow:
          1px 5px 5px #474646,
          0px 4px 4px #515151,
          1px 3px 3px #565656,
          2px 2px 2px #656565;
        text-decoration: underline;
        text-decoration-style: wavy;
        text-decoration-thickness: 3px;
        text-decoration-color: #333;
        word-spacing: 50px;
        margin-bottom: 55px;
      }
      .kotak {
        margin: auto;
        background-color: rgb(255 255 255 / 20%);
        box-shadow: 0 6px 6px hsla(0, 0%, 46%, 0.832);

        width: 800px;
        border-radius: 10px;
        margin-bottom: 50px;
      }
      p {
        text-align: center;
        line-height: 70px;
        color: #ffffff;
        font-family: "poppins";
        word-spacing: 34px;
        font-size: 22px;
      }
      span {
        text-decoration: line-through;
        text-decoration-thickness: 3.1px;
        text-decoration-color: hsl(0, 68%, 41%);
        color: hsl(0, 50%, 37%);
      }
      cite {
        display: block;
        text-align: center;
        font-size: 17px;
        font-style: normal;
        color: #c5c4c4;
        letter-spacing: 2px;
        word-spacing: 20px;
        font-family: "serif";
        margin-top: 20px;
      }
      .garis {
        border-top: 4px solid rgba(101, 100, 100, 0.2);
        margin-top: 50px;
        width: 600px;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <h1>FASE RUNTUH</h1>
    <blockquote>
      <div class="kotak">
        <p>
          "Tak perlu khawatir, ku hanya <span>~terluka~</span>.<br />Terbiasa
          tuk pura-pura tertawa.<br />Namun bolehkah sekali saja ku menangis?<br />Sebelum
          kembali membohongi diri."
        </p>
      </div>
      <div class="garis"></div>
      <cite>– feby putri feat. fiersa besari</cite>
    </blockquote>
  </body>
</html>
