<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background</title>
    <style>
        body{
            min-height: 100vh;
            background-image: url(img/13203a11a2df21ad996e800033df2738.jpg);
            background-repeat: no-repeat;
            background-position: center;
        }
        .kotak{
            width: 300px;
            height: 300px;
            background-color: yellowgreen;
            background-image: linear-gradient(yellowgreen, rgb(148, 148, 255));
        }
        .kotak2{
            width: 300px;
            height: 300px;
            background-color: yellowgreen;
            margin-top: 20px;
            background-image: radial-gradient(yellowgreen, rgb(148, 148, 255));
        }
    </style>
</head>
<body>
    <div class="kotak"></div>
    <div class="kotak2"></div>
</body>
</html>
