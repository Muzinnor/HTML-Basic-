<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text style</title>
    <style>
        h1{
            font-size: 100px;
            text-align: center;
            text-transform: capitalize;
            
            text-decoration: underline;
            text-decoration-thickness: 5px;
            text-decoration-skip-ink:none ;
            color: yellowgreen;
        }
        p{
            text-align: left;
            font-size: 27px;
            text-indent: 20px;
            word-spacing: 10px;
            white-space: pre-wrap;
            color: yellowgreen;
        }

    </style>
</head>
<body>
    <h1>Hello,World</h1>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Non possimus harum excepturi, ratione labore sed commodi quam culpa laudantium enim, voluptate quidem molestiae itaque. Assumenda alias sed quidem adipisci molestiae!</p>
</body>
</html>
