<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihat 2</title>
    <style>
        @font-face {
            font-family: "Playfair";
            src: url(font/PLAYFAIRDISPLAY-EXTRABOLD.TTF) format('truetype');
            font-display: swap;
            font-style: normal;
            font-weight: normal;
        }
        @font-face {
            font-family: 'poppins';
            src: url(font/POPPINS-REGULAR.TTF) format('truetype');
            font-style: normal;
            font-weight: normal;
            font-display: swap;
        }
        body{
            background-color: rgb(225, 132, 69);
        }
        h1{
            font-size: 50px;
            text-align: center;
            color:rgb(162, 79, 79);
            font-style: italic;
            font-family: "Playfair";
            letter-spacing: 10px;
            text-decoration: underline;
            text-decoration-style:wavy;
            text-decoration-thickness:3px;
            text-decoration-color: #ffffff;
            word-spacing: 50px;
            margin-bottom: 55px;
            text-shadow: 3px 2px 4px rgb(255, 238, 238);
        }
        p{
            text-align: center;
            line-height: 70px;
            color: white;
            font-family: "poppins";
            word-spacing: 34px;
            font-size: 22px;
        }
        span{
            text-decoration: line-through;
            text-decoration-thickness: 3.1px;
            text-decoration-color: hsl(0, 74%, 53%);
            color: hsl(0, 100%, 52%);
        }
        cite{
            display: block;
            text-align: center;
            font-size: 17px;
            font-style: normal;
            color: #d6d5d5;
            letter-spacing: 2px;
            word-spacing: 20px;
            font-family: 'serif';
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>FASE RUNTUH</h1>
    <blockquote>
        <p>"Tak perlu khawatir, ku hanya <span>~terluka~</span>.<br>Terbiasa tuk pura-pura tertawa.<br>Namun bolehkah sekali saja ku menangis?<br>Sebelum kembali membohongi diri."</p>
        <cite>– feby putri feat. fiersa besari</cite>
    </blockquote>
</body>
</html>
