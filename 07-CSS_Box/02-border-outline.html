<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>border&outline</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .kotak1{
            width: 100px;
            height: 100px;
            border: 1px solid black;
            background-color: yellowgreen;
            color: white;
            padding: 20px;
            box-sizing: border-box;
            outline: 1px solid red;
            margin-bottom: -5px;
        }
        .kotak2{
            width: 100px;
            height: 100px;
            background-color: seagreen;
            color: white;
        }
    </style>
</head>
<body>
    <div class="kotak1"><p>1</p></div>
    <div class="kotak2"><p>2</p></div>
</body>
</html>
