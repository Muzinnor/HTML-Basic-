<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f5f5f5;
        padding: 40px;
      }
      .card-produk{
        background-color: white;
        width: 330px;
        margin: 0 auto;
        border-radius: 16px;
        padding: 24px;
        border: 1px solid #e0e0e0;
        box-shadow: 0 10px 20px rgb(0 0 0 / 0.1%);
      }
      .gambar-produk {
        width: 100%;
        height: 240px;
        overflow: hidden;
        border-radius: 12px;
        margin-bottom: 20px;
      }
      .gambar-produk img{
        width: 100%;
        height: 100%;
        background-size: cover;
      }
      .info-produk{
        font-size: 12px;
        color: red;
        text-transform: uppercase;
        font-weight: bold;
        margin-bottom: 8px;
        letter-spacing: 1.5px;
      }
      .judul-produk{
        font-size: 22px;
        font-weight: bold;
        color: #1a1a1a;
        margin-bottom: 12px;
      }
      .produk-deskripsi{
        font-size: 14px;
        color: #666;
        line-height: 1.6;
        margin-bottom: 20px;
        padding-bottom: 20px;
        border-bottom: 1px solid #eee;
      }
      .price-section{
        margin-bottom: 20px;
      }
      .price-section .price {
        font-size: 26px;
        color: #000;
        font-weight: bold;
      }
      .price-section .Harga-asli{
        font-size: 15px;
        color: #999;
        text-decoration: line-through;
        margin-left: 8px;
      }
      .size-options-wrapper{
        border: none;
      }
      .size-label-text{
        font-size: 13px;
        color: #333;
        font-weight: bold;
        margin-bottom:12px ;
      }
      .size-options{
        margin-bottom:25px;
      }
      .size-options input[type="radio"]{
        display: none;
      }
      .size-options label {
        display: inline-block;
        width: 44px;
        height: 44px;
        transition: 0.3s ease;
        border: 1px solid #eee;
        text-align: center;
        line-height: 44px;
        margin-right: 8px;
        font-weight: bold;
        color: #555;
        cursor: pointer;
        border-radius:8px;
      }
      .size-options input[type="radio"]:checked+label{
        background-color: #000;
        color: #eaeaea;
        border-color: #000 ;
      }
      .buy-button {
        width: 100%;
        padding: 16px;
        background-color: #000;
        color: white;
        border: none;
        border-radius:10px;
        text-transform: uppercase;
        font-weight: bold;
        transition: 0.3s ease;
        letter-spacing: 1px;
      }
      .buy-button:hover{
        background-color: #333;
      }

    </style>

  </head>

  <body>
    <article class="card-produk">

      <figure class="gambar-produk">

        <img
          src="img/Gemini_Generated_Image_jrwy6rjrwy6rjrwy.jpg"
          alt="sepatu"
        />
      </figure>

      <p class="info-produk">NIKE SPORTSWEAR</p>

      <h3 class="judul-produk">Air Max Essential</h3>

      <p class="produk-deskripsi">
        Kombinasi sempurna antara gaya retro dan kenyamanan modern. Dilengkapi
        dengan teknologi Air-Sole untuk bantalan yang responsif setiap hari.
      </p>

      <div class="price-section">
        <span class="price">IDR 1,988,000</span>
        <del class="Harga-asli">2,299,000</del>
      </div>

      <fieldset class="size-options-wrapper">
        <legend class="size-label-text">Pilih ukuran (US) :</legend>

        <form action="">
          <div class="size-options">
            <input type="radio" name="size" id="s8" value="8" />
            <label for="s8">8</label>

            <input type="radio" name="size" id="s9" value="9" />
            <label for="s9">9</label>

            <input type="radio" name="size" id="s10" value="10" />
            <label for="s10">10</label>

            <input type="radio" name="size" id="s11" value="11" />
            <label for="s11">11</label>

            <input type="radio" name="size" id="s12" value="12" />
            <label for="s12">12</label>
          </div>
        </form>

      </fieldset>

      <button class="buy-button" type="submit">Tambahakan ke keranjang</button>

    </article>

  </body>
</html>
