<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table & form</title>
</head>
<body>  
    <Table border="1" cellpadding="8" cellspacing="0">
        <form>
            <tr>
                <td><label for="text">Nama : </label></td>
                <td colspan="2"><input type="text" name="text" id="text" placeholder="Masukan nama"></td>
                
            </tr>
            <tr>
                <td><label for="password">Password : </label></td>
                <td colspan="2"><input type="password" name="password" id="password" placeholder="Masukan Password"></td>
            </tr>
            <tr>
                <td><input type="radio" name="Gender" id="Gender-laki" value="Laki-Laki"><label for="Gender-laki">Laki-Laki</label>
        
                <td colspan="2"><input type="radio" name="Gender" id="Gender-perempuan" value="perempuan"><label for="Gender-perempuan">Perempuan</label></td></td>
            </tr>
            <tr>
                <td><input type="checkbox" name="hobi1" id="hobi1" value="Baca_Buku"><label for="hobi1">Baca Buku</label>
       
                <td> <input type="checkbox" name="hobi2" id="hobi2" value="Coding"><label for="hobi2">Coding</label>
        
                <td><input type="checkbox" name="hobi3" id="hobi3" value="Olahraga"><label for="hobi3">Olahraga</label></td></td></td>
            </tr>
            <tr>
                <td><label for="email">Email : </label></td>
                <td colspan="2"> <input type="email" name="email" id="email" placeholder="Masukan Email"></td>
            </tr>
            <tr>
                <td align="center" colspan="3"><button type="submit">Kirim</button></td>
            </tr>
        </form>
    </Table>
</body>
</html>
