<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
</head>
<body>
    <h1>Table</h1>
    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>1,1</th>
                <th colspan="2">colspan = 2</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>2,1</td>
                <td>2,2</td>
                <td>2,3</td>
            </tr>
        </tbody>

        <tfoot>
            <td>3,1</td>
            <td>3,2</td>
            <td>3,3</td>
        </tfoot>
    </table>
    <table border="1" cellspacing="0" cellpadding="8">
            <tr>
                <th rowspan="3">Rowspan = 3</th>
                <th colspan="2">Colspan = 2</th>
            </tr>
            <tr>
                
                <td>2,2</td>
                <td>2,3</td>
            </tr>
            <tr>

                <td>3,2</td>
                <td>3,3</td>
            </tr>
    </table>
</body>
</html>
