<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Belajar Form</h1>
    <form>
        <label for="text">Nama : </label>
        <input type="text" name="text" id="text" placeholder="Masukan nama">
        <label for="password">Password : </label>
        <input type="password" name="password" id="password" placeholder="Masukan Password">
        <input type="radio" name="Gender" id="Gender-laki" value="Laki-Laki"><label for="Gender-laki">Laki-Laki</label>
        <input type="radio" name="Gender" id="Gender-perempuan" value="perempuan"><label for="Gender-perempuan">Perempuan</label>
        <input type="checkbox" name="hobi1" id="hobi1" value="Baca_Buku"><label for="hobi1">Baca Buku</label>
        <input type="checkbox" name="hobi2" id="hobi2" value="Coding"><label for="hobi2">Coding</label>
        <input type="checkbox" name="hobi3" id="hobi3" value="Olahraga"><label for="hobi3">Olahraga</label>
        <button type="submit">Kirim</button>
        <label for="email">Email : </label>
        <input type="email" name="email" id="email" placeholder="Masukan Email">
    </form>
</body>
</html>
